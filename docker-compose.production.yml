volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: Silence859/kittygram_backend:latest
    env_file: .env
    volumes:
      - static:/app/static
      - media:/app/media
    depends_on:
      - db

  frontend:
    image: Silence859/kittygram_frontend:latest
    env_file: .env
    command: sh -c "cp -r /app/build/. /static/ && cp -r /static/static/* /static/ && rm -rf /static/static"
    volumes:
      - static:/static

  gateway:
    image: Silence859/kittygram_gateway:latest
    env_file: .env
    ports:
      - "9000:80"
    volumes:
      - static:/static
      - media:/media
    depends_on:
      - backend